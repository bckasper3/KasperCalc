<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 330 215" width="330" height="215" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Principal axes of an equal-leg angle section</title>
  <desc id="figDesc">An equal-leg angle with both principal axes drawn through its centroid at 45 degrees: the strong axis runs through the heel and the opposite corner, and the weak axis, about which the column buckles, is perpendicular to it</desc>
  <style>
    .cb-ref      { stroke:#434343; fill:#dce7ea; stroke-width:1.6 }
    .cb-ref-line { stroke:#434343; stroke-width:1.6; fill:none }
    .cb-ref-dash { stroke:#5A6168; stroke-width:1; fill:none; stroke-dasharray:5 3 }
    .cb-ref-hot  { stroke:#a3312a; stroke-width:2; fill:none }
    .cb-ref-hotf { fill:#a3312a }
    .cb-ref-t    { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#1C2227 }
    .cb-ref-ts   { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#5A6168 }
    .cb-ref-tb   { font-family:Roboto,Arial,sans-serif; font-size:11px; font-weight:700; fill:#61828A }
    .cb-hatchline{ stroke:#5A6168; stroke-width:1.1 }
    .cb-strong   { stroke:#3a6270; stroke-width:1.8; fill:none }
  </style>
  <rect x="0" y="0" width="330" height="215" fill="#ffffff"/>

  <!-- equal-leg angle: 100 x 100, t = 16, heel at (70,150) -->
  <rect x="70" y="134" width="100" height="16" class="cb-ref" />
  <rect x="70" y="50" width="16" height="84" class="cb-ref" />

  <!-- drawing axes through the centroid -->
  <line x1="48" y1="119.17" x2="200" y2="119.17" class="cb-ref-dash" />
  <line x1="100.83" y1="34" x2="100.83" y2="184" class="cb-ref-dash" />
  <text x="205" y="122" class="cb-ref-ts">x</text>
  <text x="105" y="33" class="cb-ref-ts">y</text>

  <!-- strong principal axis: heel, inner corner and far corner all lie on it -->
  <line x1="60" y1="160" x2="180" y2="40" class="cb-strong" />
  <text x="184" y="37" class="cb-ref-tb" fill="#3a6270">w&#8211;w strong axis</text>
  <text x="184" y="50" class="cb-ref-ts">through both corners</text>
  <text x="184" y="62" class="cb-ref-ts">= axis of symmetry</text>

  <!-- weak principal axis: perpendicular to it, through the centroid -->
  <line x1="48.5" y1="66.9" x2="153.1" y2="171.5" class="cb-ref-hot" />
  <text x="158" y="169" class="cb-ref-tb" fill="#a3312a">z&#8211;z weak axis</text>
  <text x="158" y="182" class="cb-ref-ts">buckles about this &#8212; use I_min</text>

  <!-- 45 degrees off the drawing axes -->
  <path d="M 126.83 119.17 A 26 26 0 0 0 119.21 100.79" class="cb-ref-dash" stroke-dasharray="none" />
  <text x="130" y="107" class="cb-ref-ts">45&#176;</text>

  <circle cx="100.83" cy="119.17" r="3" fill="#434343" />
  <text x="95" y="112" class="cb-ref-ts" text-anchor="end">C</text>

  <text x="165" y="203" class="cb-ref-ts" text-anchor="middle">both principal axes pass through the centroid at 45&#176;</text>
</svg>
