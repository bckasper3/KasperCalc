  <title id="figTitle">Column curve: crippling cutoff, Johnson parabola and Euler hyperbola</title>
  <desc id="figDesc">The column curve: a crippling plateau, a Johnson parabola and the Euler hyperbola meeting tangentially</desc>
  <style>
