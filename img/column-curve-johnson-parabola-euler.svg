  </style>
  <rect x="0" y="0" width="430" height="250" fill="#ffffff"/>
<line x1="54" y1="210" x2="410" y2="210" class="cb-ref-line" />
          <line x1="54" y1="22" x2="54" y2="210" class="cb-ref-line" />
