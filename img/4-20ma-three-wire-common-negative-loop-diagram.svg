<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 620 230" width="620" height="230" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Three-wire 4-20mA loop, common negative, low-side sensing</title>
  <desc id="figDesc">Three wire common negative low side current loop diagram</desc>
  <rect x="0" y="0" width="620" height="230" fill="#ffffff"/>
<rect x="20" y="45" width="120" height="100" rx="6" fill="#e8f0f3" stroke="#1a3a40" stroke-width="2"/>
                  <text x="80" y="90" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Power</text>
                  <text x="80" y="107" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Supply</text>
                  <text x="30" y="65" font-size="14.5" font-weight="700" fill="#61828A">V+</text>
                  <text x="30" y="135" font-size="14.5" font-weight="700" fill="#61828A">COM</text>

                  <rect x="250" y="30" width="130" height="90" rx="6" fill="#fff" stroke="#1a3a40" stroke-width="2"/>
                  <text x="315" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a40">Transmitter</text>
                  <text x="315" y="75" text-anchor="middle" font-size="13.5" fill="#61828A">PWR+  OUT  COM</text>

                  <rect x="470" y="120" width="90" height="55" rx="6" fill="#fff" stroke="#1a3a40" stroke-width="2"/>
                  <text x="515" y="143" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a3a40">Receiver</text>
                  <text x="515" y="160" text-anchor="middle" font-size="13.5" fill="#61828A">R</text>

                  <path d="M140 60 H 250" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow3)"/>
                  <text x="195" y="52" text-anchor="middle" font-size="12.5" fill="#61828A">dedicated power</text>

                  <path d="M380 60 H 515 V 120" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow3)"/>
                  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#61828A">signal OUT</text>

                  <path d="M515 175 V 205 H 80 V 145" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow3)"/>
                  <path d="M315 120 V 205" fill="none" stroke="#1a3a40" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
                  <defs>
                    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                      <path d="M0,0 L6,3 L0,6 Z" fill="#1a3a40"/>
                    </marker>
                  </defs>
                  <text x="220" y="218" text-anchor="middle" font-size="12.5" fill="#61828A">shared negative / common return (low side)</text>
