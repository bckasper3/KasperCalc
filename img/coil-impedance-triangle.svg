<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Coil impedance: resistance, reactance and their vector sum</title>
  <desc id="figDesc">The resistance and the inductive reactance of a coil add as perpendicular vectors, so the impedance is the hypotenuse and the power factor is the cosine of the angle between them.</desc>
  <style>
    text        { font-family: Roboto, Arial, Helvetica, sans-serif }
    .t          { font-size: 11px; fill: #1C2227 }
    .ts         { font-size: 10px; fill: #5A6168 }
    .tb         { font-size: 11px; font-weight: 700; fill: #61828A }
    .tr         { font-size: 11px; font-weight: 700; fill: #a3312a }
    .axis       { stroke: #434343; stroke-width: 1.6; fill: none }
    .dash       { stroke: #5A6168; stroke-width: 1; fill: none; stroke-dasharray: 5 3 }
    .body       { stroke: #434343; fill: #dce7ea; stroke-width: 1.6 }
    .iron       { stroke: #434343; fill: #c9d2d6; stroke-width: 1.6 }
    .cu         { stroke: #8a6420; fill: #e6b45c; stroke-width: 1 }
    .hot        { stroke: #a3312a; stroke-width: 2.2; fill: none }
    .hotf       { fill: #a3312a }
    .cool       { stroke: #3a6270; stroke-width: 2.2; fill: none }
    .coolf      { fill: #3a6270 }
    .warm       { stroke: #c87941; stroke-width: 2.2; fill: none }
    .thin       { stroke: #5A6168; stroke-width: 0.9; fill: none }
  </style>
  <rect x="0" y="0" width="520" height="280" fill="#ffffff"/>
  <line x1="70" y1="190" x2="272" y2="190" class="cool"/>
  <polygon points="280,190 272,193.6 272,186.4" class="coolf"/>
  <text x="175" y="208" class="tb" text-anchor="middle">R — the copper</text>
  <text x="175" y="221" class="ts" text-anchor="middle">burns real watts</text>
  <line x1="280" y1="190" x2="280" y2="68" class="warm"/>
  <polygon points="280,60 283.6,68 276.4,68" class="hotf"/>
  <text x="288" y="125" class="tb">Xʟ = 2πfL</text>
  <text x="288" y="138" class="ts">borrows and returns</text>
  <text x="288" y="150" class="ts">energy each cycle</text>
  <line x1="70" y1="190" x2="280" y2="60" class="hot"/>
  <text x="145" y="119" class="tr" text-anchor="middle">|Z| = √(R² + Xʟ²)</text>
  <path d="M 104 190 A 34 34 0 0 0 98.909 172.104" class="dash"/>
  <text x="110" y="178" class="ts">φ</text>
  <text x="70" y="242" class="ts">Power factor = R/|Z| = cos φ.  On DC there is no Xʟ at all, so the current is simply V/R.</text>
  <text x="70" y="256" class="ts">That is the whole reason a coil behaves so differently on AC and DC.</text>

</svg>
