<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 172 150" width="172" height="150" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Lug failure mode: dishing, out-of-plane buckling of a thin lug</title>
  <desc id="figDesc">Edge view of a thin lug bowed out of plane, with a straight dashed reference line and inward end loads.</desc>
  <style>
    .m-body { fill:#f2f5f6; stroke:#434343; stroke-width:2 }
    .m-hole { fill:#ffffff; stroke:#434343; stroke-width:2 }
    .m-fail { stroke:#a3312a; stroke-width:3.2; fill:none; stroke-linecap:round }
    .m-ghost{ stroke:#a3312a; stroke-width:1.5; fill:none; stroke-dasharray:4 3 }
    .m-load { stroke:#5A6168; stroke-width:1.8; fill:none }
    .m-head { fill:#5A6168 }
    .m-ref  { stroke:#5A6168; stroke-width:1; fill:none; stroke-dasharray:3 3; opacity:.6 }
  </style>
  <rect x="0" y="0" width="172" height="150" fill="#ffffff"/>
<path class="m-ref" d="M16,75 L156,75" />
              <path class="m-body" d="M16,70 Q86,38 156,70 L156,80 Q86,48 16,80 Z" />
              <line class="m-fail" x1="86" y1="50" x2="86" y2="32" />
              <polygon points="86,24 81.5,34 90.5,34" fill="#a3312a" />
              <line class="m-load" x1="2" y1="104" x2="20" y2="104" />
              <polygon class="m-head" points="26,104 17,99.5 17,108.5" />
              <line class="m-load" x1="170" y1="104" x2="152" y2="104" />
              <polygon class="m-head" points="146,104 155,99.5 155,108.5" />
</svg>
