<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 560 235" width="560" height="235" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">An open rod core never reaches its material permeability</title>
  <desc id="figDesc">Free poles at the ends of a bare rod oppose the field the coil is driving, collapsing the effective permeability; closing the circuit with a steel shell or yoke removes most of that penalty.</desc>
  <style>
    text        { font-family: Roboto, Arial, Helvetica, sans-serif }
    .t          { font-size: 11px; fill: #1C2227 }
    .ts         { font-size: 10px; fill: #5A6168 }
    .tb         { font-size: 11px; font-weight: 700; fill: #61828A }
    .tr         { font-size: 11px; font-weight: 700; fill: #a3312a }
    .axis       { stroke: #434343; stroke-width: 1.6; fill: none }
    .dash       { stroke: #5A6168; stroke-width: 1; fill: none; stroke-dasharray: 5 3 }
    .body       { stroke: #434343; fill: #dce7ea; stroke-width: 1.6 }
    .iron       { stroke: #434343; fill: #c9d2d6; stroke-width: 1.6 }
    .cu         { stroke: #8a6420; fill: #e6b45c; stroke-width: 1 }
    .hot        { stroke: #a3312a; stroke-width: 2.2; fill: none }
    .hotf       { fill: #a3312a }
    .cool       { stroke: #3a6270; stroke-width: 2.2; fill: none }
    .coolf      { fill: #3a6270 }
    .warm       { stroke: #c87941; stroke-width: 2.2; fill: none }
    .thin       { stroke: #5A6168; stroke-width: 0.9; fill: none }
  </style>
  <rect x="0" y="0" width="560" height="235" fill="#ffffff"/>
  <text x="140" y="18" class="tb" text-anchor="middle">Open rod</text>
  <text x="410" y="18" class="tb" text-anchor="middle">Closed with a shell or yoke</text>
  <rect x="90" y="100" width="110" height="26" class="iron"/>
  <circle cx="108" cy="92" r="6.5" class="cu"/>
  <circle cx="108" cy="134" r="6.5" class="cu"/>
  <circle cx="128" cy="92" r="6.5" class="cu"/>
  <circle cx="128" cy="134" r="6.5" class="cu"/>
  <circle cx="148" cy="92" r="6.5" class="cu"/>
  <circle cx="148" cy="134" r="6.5" class="cu"/>
  <circle cx="168" cy="92" r="6.5" class="cu"/>
  <circle cx="168" cy="134" r="6.5" class="cu"/>
  <circle cx="188" cy="92" r="6.5" class="cu"/>
  <circle cx="188" cy="134" r="6.5" class="cu"/>
  <path d="M 200 113 C 250 113 250 55 145 55 C 40 55 40 113 90 113" class="dash"/>
  <text x="145" y="46" class="ts" text-anchor="middle">flux has to close through air</text>
  <text x="140" y="170" class="t" text-anchor="middle">μ_eff = μ_r / (1 + N_d(μ_r − 1))</text>
  <text x="140" y="190" class="tr" text-anchor="middle">L/D = 5 → about 18</text>
  <text x="140" y="204" class="tr" text-anchor="middle">L/D = 20 → about 130</text>
  <text x="140" y="218" class="ts" text-anchor="middle">never the 1000 of the steel</text>
  <rect x="330" y="100" width="150" height="26" class="iron"/>
  <rect x="330" y="60" width="12" height="106" class="iron"/>
  <rect x="468" y="60" width="12" height="106" class="iron"/>
  <rect x="330" y="60" width="150" height="12" class="iron"/>
  <rect x="330" y="154" width="150" height="12" class="iron"/>
  <circle cx="360" cy="92" r="6.5" class="cu"/>
  <circle cx="360" cy="134" r="6.5" class="cu"/>
  <circle cx="380" cy="92" r="6.5" class="cu"/>
  <circle cx="380" cy="134" r="6.5" class="cu"/>
  <circle cx="400" cy="92" r="6.5" class="cu"/>
  <circle cx="400" cy="134" r="6.5" class="cu"/>
  <circle cx="420" cy="92" r="6.5" class="cu"/>
  <circle cx="420" cy="134" r="6.5" class="cu"/>
  <circle cx="440" cy="92" r="6.5" class="cu"/>
  <circle cx="440" cy="134" r="6.5" class="cu"/>
  <text x="405" y="190" class="t" text-anchor="middle">the iron carries the return path,</text>
  <text x="405" y="204" class="t" text-anchor="middle">so the gap sets the reluctance</text>
  <text x="405" y="218" class="ts" text-anchor="middle">and μ_r is finally worth having</text>

</svg>
