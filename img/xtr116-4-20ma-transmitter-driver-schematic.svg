  <rect x="0" y="-30" width="680" height="330" fill="#ffffff"/>
<rect x="20" y="-25" width="410" height="290" rx="4" fill="none" stroke="#1a3a40" stroke-width="1.5" stroke-dasharray="3,3"/>
                  <text x="225" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#61828A">DRIVER ENCLOSURE</text>

