     viewBox="0 0 620 210" width="620" height="210" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Two-wire 4-20mA current loop wiring diagram</title>
  <desc id="figDesc">Two wire current loop diagram</desc>
  <rect x="0" y="0" width="620" height="210" fill="#ffffff"/>
<rect x="20" y="65" width="130" height="80" rx="6" fill="#e8f0f3" stroke="#1a3a40" stroke-width="2"/>
                  <text x="85" y="100" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Loop Supply</text>
                  <text x="85" y="118" text-anchor="middle" font-size="14.5" fill="#1a3a40">(e.g. 24V DC)</text>
                  <text x="35" y="80" font-size="15.5" font-weight="700" fill="#61828A">+</text>
                  <text x="35" y="138" font-size="15.5" font-weight="700" fill="#61828A">&#8722;</text>

                  <rect x="245" y="30" width="150" height="70" rx="6" fill="#fff" stroke="#1a3a40" stroke-width="2"/>
                  <text x="320" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a40">2-Wire</text>
                  <text x="320" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a40">Transmitter</text>
                  <text x="320" y="90" text-anchor="middle" font-size="13.5" fill="#61828A">4&#8211;20mA</text>

                  <rect x="490" y="65" width="90" height="80" rx="6" fill="#fff" stroke="#1a3a40" stroke-width="2"/>
                  <text x="535" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a40">Receiver</text>
                  <text x="535" y="118" text-anchor="middle" font-size="14.5" fill="#61828A">R &#8776; 250&#8486;</text>

                  <path d="M150 80 H 245" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow1)"/>
                  <path d="M320 100 V 130 H 490" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow1)"/>
                  <path d="M535 145 V 165 H 85 V 145" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow1)"/>

                  <defs>
                    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                      <path d="M0,0 L6,3 L0,6 Z" fill="#1a3a40"/>
