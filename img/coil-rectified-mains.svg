  <text x="265" y="200" class="tr" text-anchor="middle">Voltage goes up 41% at the same moment the current limiting goes away.</text>
  <text x="265" y="215" class="ts" text-anchor="middle">On an inductive coil that is routinely five to ten times the current, and</text>
  <text x="265" y="228" class="ts" text-anchor="middle">twenty-five to a hundred times the heating.</text>

