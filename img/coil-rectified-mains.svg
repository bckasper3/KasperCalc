<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 530 245" width="530" height="245" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">What a rectifier does to a coil running on mains</title>
  <desc id="figDesc">Rectifying mains with a smoothing capacitor raises the voltage from the RMS value to the peak and removes the inductive reactance that was limiting the current, so the current rises sharply.</desc>
