<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 560 255" width="560" height="255" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Why the working gap dominates a magnetic circuit</title>
  <desc id="figDesc">Air has no relative permeability to divide by, so even a fraction of a millimetre of working gap carries far more magnetic reluctance than the entire iron path.</desc>
  <style>
    text        { font-family: Roboto, Arial, Helvetica, sans-serif }
    .t          { font-size: 11px; fill: #1C2227 }
    .ts         { font-size: 10px; fill: #5A6168 }
    .tb         { font-size: 11px; font-weight: 700; fill: #61828A }
    .tr         { font-size: 11px; font-weight: 700; fill: #a3312a }
    .axis       { stroke: #434343; stroke-width: 1.6; fill: none }
    .dash       { stroke: #5A6168; stroke-width: 1; fill: none; stroke-dasharray: 5 3 }
    .body       { stroke: #434343; fill: #dce7ea; stroke-width: 1.6 }
    .iron       { stroke: #434343; fill: #c9d2d6; stroke-width: 1.6 }
    .cu         { stroke: #8a6420; fill: #e6b45c; stroke-width: 1 }
    .hot        { stroke: #a3312a; stroke-width: 2.2; fill: none }
    .hotf       { fill: #a3312a }
    .cool       { stroke: #3a6270; stroke-width: 2.2; fill: none }
    .coolf      { fill: #3a6270 }
    .warm       { stroke: #c87941; stroke-width: 2.2; fill: none }
    .thin       { stroke: #5A6168; stroke-width: 0.9; fill: none }
  </style>
  <rect x="0" y="0" width="560" height="255" fill="#ffffff"/>
  <text x="260" y="18" class="tb" text-anchor="middle">The gap carries almost all of the reluctance</text>
  <rect x="60" y="60" width="300" height="26" class="iron"/>
  <rect x="60" y="170" width="300" height="26" class="iron"/>
  <rect x="60" y="60" width="26" height="136" class="iron"/>
  <rect x="334" y="60" width="26" height="46" class="iron"/>
  <rect x="334" y="150" width="26" height="46" class="iron"/>
  <circle cx="120" cy="128" r="7" class="cu"/>
  <circle cx="146" cy="128" r="7" class="cu"/>
  <circle cx="172" cy="128" r="7" class="cu"/>
  <circle cx="198" cy="128" r="7" class="cu"/>
  <circle cx="224" cy="128" r="7" class="cu"/>
  <circle cx="250" cy="128" r="7" class="cu"/>
  <text x="180" y="152" class="ts" text-anchor="middle">coil</text>
  <rect x="334" y="106" width="26" height="44" class="body"/>
  <text x="347" y="100" class="tr" text-anchor="middle">gap</text>
  <line x1="334" y1="106" x2="360" y2="106" class="hot"/>
  <line x1="334" y1="150" x2="360" y2="150" class="hot"/>
  <text x="400" y="70" class="t">ℛ_iron = l / (μ₀μ_r A)</text>
  <text x="400" y="85" class="ts">small, because μ_r is</text>
  <text x="400" y="97" class="ts">a thousand or more</text>
  <text x="400" y="128" class="tr">ℛ_gap = g / (μ₀ A)</text>
  <text x="400" y="143" class="ts">large, because air has</text>
  <text x="400" y="155" class="ts">no μ_r to divide by</text>
  <text x="60" y="224" class="ts">A 1 mm gap in a 100 mm steel path with μ_r = 1000 has a hundred times the reluctance of all the iron.</text>
  <text x="60" y="238" class="ts">That is why force collapses as the gap opens, and why a solenoid slams shut at the end of its stroke.</text>

</svg>
