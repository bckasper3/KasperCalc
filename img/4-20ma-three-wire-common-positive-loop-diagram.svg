<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Three-wire 4-20mA loop, common positive, high-side sensing</title>
  <desc id="figDesc">Three wire common positive high side current loop diagram</desc>
  <style>
    text { font-family: Roboto, Arial, Helvetica, sans-serif }
  </style>
  <rect x="0" y="0" width="620" height="300" fill="#ffffff"/>
<rect x="20" y="30" width="140" height="100" rx="6" fill="#e8f0f3" stroke="#1a3a40" stroke-width="2"/>
                  <text x="35" y="55" font-size="14.5" font-weight="700" fill="#61828A">V+</text>
                  <text x="90" y="82" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Power</text>
                  <text x="90" y="104" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Supply</text>
                  <text x="35" y="120" font-size="14.5" font-weight="700" fill="#61828A">V&#8722;</text>

                  <rect x="460" y="30" width="140" height="100" rx="6" fill="#fff" stroke="#1a3a40" stroke-width="2"/>
                  <text x="530" y="78" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Receiver</text>
                  <text x="530" y="100" text-anchor="middle" font-size="14.5" fill="#61828A">R</text>

                  <rect x="245" y="200" width="150" height="90" rx="6" fill="#fff" stroke="#1a3a40" stroke-width="2"/>
                  <text x="320" y="238" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1a3a40">Transmitter</text>
                  <text x="320" y="260" text-anchor="middle" font-size="13.5" fill="#61828A">RTN   OUT (sink)</text>

                  <path d="M160 80 H 460" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow4)"/>
                  <path d="M320 80 V 200" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow4)"/>
                  <text x="310" y="70" text-anchor="middle" font-size="13.5" fill="#61828A">shared positive rail (high side)</text>

                  <path d="M245 245 H 90 V 130" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow4)"/>
                  <text x="165" y="232" text-anchor="middle" font-size="13.5" fill="#61828A">dedicated return</text>

                  <path d="M530 130 V 245 H 395" fill="none" stroke="#1a3a40" stroke-width="2" marker-end="url(#arrow4)"/>
                  <defs>
                    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                      <path d="M0,0 L6,3 L0,6 Z" fill="#1a3a40"/>
                    </marker>
                  </defs>
                  <text x="462" y="232" text-anchor="middle" font-size="13.5" fill="#61828A">sinks current</text>
</svg>
