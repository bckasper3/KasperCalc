<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 172 150" width="172" height="150" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Lug failure mode: shear-out</title>
  <desc id="figDesc">Lug outline with two parallel shear planes running from the hole out to the loaded edge.</desc>
  <style>
    .m-body { fill:#f2f5f6; stroke:#434343; stroke-width:2 }
    .m-hole { fill:#ffffff; stroke:#434343; stroke-width:2 }
    .m-fail { stroke:#a3312a; stroke-width:3.2; fill:none; stroke-linecap:round }
    .m-ghost{ stroke:#a3312a; stroke-width:1.5; fill:none; stroke-dasharray:4 3 }
    .m-load { stroke:#5A6168; stroke-width:1.8; fill:none }
    .m-head { fill:#5A6168 }
    .m-ref  { stroke:#5A6168; stroke-width:1; fill:none; stroke-dasharray:3 3; opacity:.6 }
  </style>
  <rect x="0" y="0" width="172" height="150" fill="#ffffff"/>
<path class="m-body" d="M12,29 L95,29 A46,46 0 0 1 95,121 L12,121 Z" />
              <circle class="m-hole" cx="95" cy="75" r="22" />
              <path class="m-fail" d="M95,53 L135,53" />
              <path class="m-fail" d="M95,97 L135,97" />
              <line class="m-load" x1="145" y1="75" x2="164" y2="75" />
              <polygon class="m-head" points="170,75 161,70.5 161,79.5" />
</svg>
