<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 470 150" width="470" height="150" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Crippling coefficient Ce for each edge-restraint case</title>
  <desc id="figDesc">Three edge-restraint cases for a flange and the crippling coefficient each one takes</desc>
  <style>
    .cb-ref      { stroke:#434343; fill:#dce7ea; stroke-width:1.6 }
    .cb-ref-line { stroke:#434343; stroke-width:1.6; fill:none }
    .cb-ref-dash { stroke:#5A6168; stroke-width:1; fill:none; stroke-dasharray:5 3 }
    .cb-ref-hot  { stroke:#a3312a; stroke-width:2; fill:none }
    .cb-ref-hotf { fill:#a3312a }
    .cb-ref-t    { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#1C2227 }
    .cb-ref-ts   { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#5A6168 }
    .cb-ref-tb   { font-family:Roboto,Arial,sans-serif; font-size:11px; font-weight:700; fill:#61828A }
    .cb-hatchline{ stroke:#5A6168; stroke-width:1.1 }
  </style>
  <rect x="0" y="0" width="470" height="150" fill="#ffffff"/>
<g transform="translate(16,26)">
            <rect x="0" y="30" width="104" height="14" class="cb-ref" />
            <text x="52" y="70" class="cb-ref-tb" text-anchor="middle">Two edges free</text>
            <text x="52" y="86" class="cb-ref-ts" text-anchor="middle">a plain angle leg</text>
            <text x="52" y="104" class="cb-ref-t" text-anchor="middle">C_e = 0.316</text>
          </g>
          <g transform="translate(180,26)">
            <rect x="0" y="30" width="104" height="14" class="cb-ref" />
            <rect x="0" y="14" width="14" height="46" class="cb-ref" />
            <text x="52" y="70" class="cb-ref-tb" text-anchor="middle">One edge free</text>
            <text x="52" y="86" class="cb-ref-ts" text-anchor="middle">flange on an I, channel or zee</text>
            <text x="52" y="104" class="cb-ref-t" text-anchor="middle">C_e = 0.342</text>
          </g>
          <g transform="translate(344,26)">
            <rect x="0" y="30" width="104" height="14" class="cb-ref" />
            <rect x="0" y="14" width="14" height="46" class="cb-ref" />
            <rect x="90" y="14" width="14" height="46" class="cb-ref" />
            <text x="52" y="70" class="cb-ref-tb" text-anchor="middle">No edge free</text>
            <text x="52" y="86" class="cb-ref-ts" text-anchor="middle">wall of a closed box</text>
            <text x="52" y="104" class="cb-ref-t" text-anchor="middle">C_e = 0.366</text>
          </g>
</svg>
