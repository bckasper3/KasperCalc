<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 470 180" width="470" height="180" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">I-section, channel and box divided into crippling elements</title>
  <desc id="figDesc">An I-section, a channel and a box divided into the angle elements the crippling method uses</desc>
  <style>
    .cb-ref      { stroke:#434343; fill:#dce7ea; stroke-width:1.6 }
    .cb-ref-line { stroke:#434343; stroke-width:1.6; fill:none }
    .cb-ref-dash { stroke:#5A6168; stroke-width:1; fill:none; stroke-dasharray:5 3 }
    .cb-ref-hot  { stroke:#a3312a; stroke-width:2; fill:none }
    .cb-ref-hotf { fill:#a3312a }
    .cb-ref-t    { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#1C2227 }
    .cb-ref-ts   { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#5A6168 }
    .cb-ref-tb   { font-family:Roboto,Arial,sans-serif; font-size:11px; font-weight:700; fill:#61828A }
    .cb-hatchline{ stroke:#5A6168; stroke-width:1.1 }
  </style>
  <rect x="0" y="0" width="470" height="180" fill="#ffffff"/>
<g transform="translate(30,24)">
            <rect x="0" y="0" width="90" height="13" class="cb-ref" />
            <rect x="0" y="87" width="90" height="13" class="cb-ref" />
            <rect x="38" y="13" width="13" height="74" class="cb-ref" />
            <line x1="45" y1="-8" x2="45" y2="108" class="cb-ref-hot" stroke-dasharray="4 3" />
            <line x1="-8" y1="50" x2="98" y2="50" class="cb-ref-hot" stroke-dasharray="4 3" />
            <text x="45" y="126" class="cb-ref-tb" text-anchor="middle">I-section</text>
            <text x="45" y="141" class="cb-ref-ts" text-anchor="middle">4 angles, one edge free</text>
            <text x="45" y="155" class="cb-ref-ts" text-anchor="middle">b = b_f/2, h = h/2</text>
          </g>
          <g transform="translate(190,24)">
            <rect x="0" y="0" width="80" height="13" class="cb-ref" />
            <rect x="0" y="87" width="80" height="13" class="cb-ref" />
            <rect x="0" y="13" width="13" height="74" class="cb-ref" />
            <line x1="-8" y1="50" x2="88" y2="50" class="cb-ref-hot" stroke-dasharray="4 3" />
            <text x="40" y="126" class="cb-ref-tb" text-anchor="middle">Channel</text>
            <text x="40" y="141" class="cb-ref-ts" text-anchor="middle">2 angles, one edge free</text>
            <text x="40" y="155" class="cb-ref-ts" text-anchor="middle">b = b_f, h = h/2</text>
          </g>
          <g transform="translate(346,24)">
            <rect x="0" y="0" width="94" height="13" class="cb-ref" />
            <rect x="0" y="87" width="94" height="13" class="cb-ref" />
            <rect x="0" y="13" width="13" height="74" class="cb-ref" />
            <rect x="81" y="13" width="13" height="74" class="cb-ref" />
            <line x1="47" y1="-8" x2="47" y2="108" class="cb-ref-hot" stroke-dasharray="4 3" />
            <line x1="-8" y1="50" x2="102" y2="50" class="cb-ref-hot" stroke-dasharray="4 3" />
            <text x="47" y="126" class="cb-ref-tb" text-anchor="middle">Box</text>
            <text x="47" y="141" class="cb-ref-ts" text-anchor="middle">4 corners, no edge free</text>
            <text x="47" y="155" class="cb-ref-ts" text-anchor="middle">b = b/2, h = h/2</text>
          </g>
</svg>
