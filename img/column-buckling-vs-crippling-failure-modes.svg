<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 520 356" width="520" height="356" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Column buckling compared with local crippling</title>
  <desc id="figDesc">Left: a slender column bows as a whole while its cross-section keeps its shape. Right: a short stub stays straight along its axis while a thin flange buckles into waves and the flange tips roll over. Column buckling is governed by slenderness, crippling by the width-to-thickness ratio.</desc>
  <style>
    .cb-ref      { stroke:#434343; fill:#dce7ea; stroke-width:1.6 }
    .cb-ref-line { stroke:#434343; stroke-width:1.6; fill:none }
    .cb-ref-dash { stroke:#5A6168; stroke-width:1; fill:none; stroke-dasharray:5 3 }
    .cb-ref-hot  { stroke:#a3312a; stroke-width:2; fill:none }
    .cb-ref-hotf { fill:#a3312a }
    .cb-ref-t    { font-family:Roboto,Arial,sans-serif; font-size:11px; fill:#1C2227 }
    .cb-ref-ts   { font-family:Roboto,Arial,sans-serif; font-size:10px; fill:#5A6168 }
    .cb-ref-tb   { font-family:Roboto,Arial,sans-serif; font-size:11px; font-weight:700; fill:#61828A }
    .cb-hatchline{ stroke:#5A6168; stroke-width:1.1 }
    .cb-load     { fill:#434343 }
    .cb-ghost    { stroke:#5A6168; stroke-width:1.4; fill:none; stroke-dasharray:4 3 }
  </style>
  <rect x="0" y="0" width="520" height="356" fill="#ffffff"/>
  <line x1="262" y1="8" x2="262" y2="350" class="cb-ref-dash" />

  <!-- ================= COLUMN BUCKLING ================= -->
  <text x="125" y="16" class="cb-ref-tb" text-anchor="middle">COLUMN BUCKLING</text>
  <text x="125" y="30" class="cb-ref-ts" text-anchor="middle">the axis moves &#8212; the section keeps its shape</text>

  <line x1="125" y1="38" x2="125" y2="46" class="cb-ref-line" />
  <polygon points="125,56 119,44 131,44" class="cb-load" />
  <text x="136" y="48" class="cb-ref-t">P</text>

  <line x1="125" y1="56" x2="125" y2="196" class="cb-ref-dash" />
  <path d="M118,56 C148,94 148,158 118,196 L132,196 C162,158 162,94 132,56 Z" class="cb-ref" />

  <polygon points="125,196 119,208 131,208" class="cb-load" />
  <line x1="125" y1="206" x2="125" y2="214" class="cb-ref-line" />
  <text x="136" y="210" class="cb-ref-t">P</text>

  <text x="166" y="120" class="cb-ref-ts">the whole member</text>
  <text x="166" y="132" class="cb-ref-ts">bows sideways</text>

  <line x1="100" y1="242" x2="138" y2="242" class="cb-ref-line" />
  <polygon points="146,242 137,237.5 137,246.5" class="cb-load" />
  <g transform="translate(66,250)"><path d="M0,0 H56 V7 H7 V53 H56 V60 H0 Z" class="cb-ref" /></g>
  <g transform="translate(126,250)"><path d="M0,0 H56 V7 H7 V53 H56 V60 H0 Z" class="cb-ghost" /></g>
  <text x="124" y="330" class="cb-ref-ts" text-anchor="middle">same shape, displaced sideways</text>
  <text x="124" y="345" class="cb-ref-tb" text-anchor="middle">governed by L&#8242;/&#961;</text>

  <!-- ================= CRIPPLING ================= -->
  <text x="390" y="16" class="cb-ref-tb" text-anchor="middle">CRIPPLING (LOCAL)</text>
  <text x="390" y="30" class="cb-ref-ts" text-anchor="middle">the axis stays straight &#8212; the section distorts</text>

  <line x1="348" y1="50" x2="348" y2="58" class="cb-ref-line" />
  <polygon points="348,70 342,58 354,58" class="cb-load" />
  <text x="359" y="62" class="cb-ref-t">P</text>

  <!-- short stub: web face-on, flange projecting and buckled -->
  <line x1="348" y1="66" x2="348" y2="206" class="cb-ref-dash" />
  <rect x="336" y="76" width="24" height="120" class="cb-ref" />
  <path d="M360,76 L415.0,52.0 417.3,54.5 419.6,57.0 421.7,59.5 423.5,62.0 425.0,64.5 426.1,67.0 426.8,69.5 427.0,72.0 426.8,74.5 426.1,77.0 425.0,79.5 423.5,82.0 421.7,84.5 419.6,87.0 417.3,89.5 415.0,92.0 412.7,94.5 410.4,97.0 408.3,99.5 406.5,102.0 405.0,104.5 403.9,107.0 403.2,109.5 403.0,112.0 403.2,114.5 403.9,117.0 405.0,119.5 406.5,122.0 408.3,124.5 410.4,127.0 412.7,129.5 415.0,132.0 417.3,134.5 419.6,137.0 421.7,139.5 423.5,142.0 425.0,144.5 426.1,147.0 426.8,149.5 427.0,152.0 426.8,154.5 426.1,157.0 425.0,159.5 423.5,162.0 421.7,164.5 419.6,167.0 417.3,169.5 415.0,172.0 L360,196 Z" class="cb-ref" />
  <line x1="360" y1="76.0" x2="415.0" y2="52.0" class="cb-hatchline" opacity=".55"/>
  <line x1="360" y1="100.0" x2="426.4" y2="76.0" class="cb-hatchline" opacity=".55"/>
  <line x1="360" y1="124.0" x2="407.9" y2="100.0" class="cb-hatchline" opacity=".55"/>
  <line x1="360" y1="148.0" x2="407.9" y2="124.0" class="cb-hatchline" opacity=".55"/>
  <line x1="360" y1="172.0" x2="426.4" y2="148.0" class="cb-hatchline" opacity=".55"/>
  <line x1="360" y1="196.0" x2="415.0" y2="172.0" class="cb-hatchline" opacity=".55"/>
  <polyline points="415.0,52.0 417.3,54.5 419.6,57.0 421.7,59.5 423.5,62.0 425.0,64.5 426.1,67.0 426.8,69.5 427.0,72.0 426.8,74.5 426.1,77.0 425.0,79.5 423.5,82.0 421.7,84.5 419.6,87.0 417.3,89.5 415.0,92.0 412.7,94.5 410.4,97.0 408.3,99.5 406.5,102.0 405.0,104.5 403.9,107.0 403.2,109.5 403.0,112.0 403.2,114.5 403.9,117.0 405.0,119.5 406.5,122.0 408.3,124.5 410.4,127.0 412.7,129.5 415.0,132.0 417.3,134.5 419.6,137.0 421.7,139.5 423.5,142.0 425.0,144.5 426.1,147.0 426.8,149.5 427.0,152.0 426.8,154.5 426.1,157.0 425.0,159.5 423.5,162.0 421.7,164.5 419.6,167.0 417.3,169.5 415.0,172.0" class="cb-ref-hot" />

  <polygon points="348,196 342,208 354,208" class="cb-load" />
  <line x1="348" y1="206" x2="348" y2="214" class="cb-ref-line" />
  <text x="359" y="210" class="cb-ref-t">P</text>

  <text x="332" y="150" class="cb-ref-ts" text-anchor="end">corner stays</text>
  <text x="332" y="162" class="cb-ref-ts" text-anchor="end">straight</text>
  <text x="434" y="100" class="cb-ref-ts" fill="#a3312a">free edge buckles</text>
  <text x="434" y="112" class="cb-ref-ts" fill="#a3312a">into waves</text>

  <g transform="translate(362,250)"><path d="M0,0 H56 V7 H7 V53 H56 V60 H0 Z" class="cb-ref" /></g>
  <path d="M369,253.5 Q393,251 416,241" class="cb-ref-hot" stroke-dasharray="4 3" />
  <path d="M369,306.5 Q393,309 416,319" class="cb-ref-hot" stroke-dasharray="4 3" />
  <text x="390" y="330" class="cb-ref-ts" text-anchor="middle">the flange tips roll over</text>
  <text x="390" y="345" class="cb-ref-tb" text-anchor="middle">governed by b&#8242;/t</text>
</svg>
