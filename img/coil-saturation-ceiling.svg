<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 560 240" width="560" height="240" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Saturation sets a hard ceiling on magnetic pull force</title>
  <desc id="figDesc">Once the core saturates the flux density stops rising with current, so the force per unit pole area cannot exceed the saturation flux density squared over twice the permeability of free space.</desc>
