  <text x="210" y="175" class="ts">more current here</text>
  <text x="210" y="187" class="ts">buys almost nothing</text>
  <text x="370" y="60" class="tr">p_max = B_sat² / 2μ₀</text>
  <text x="370" y="84" class="t">1.5 T  →  895 kPa  →  130 psi</text>
  <text x="370" y="100" class="t">2.0 T  →  1590 kPa  →  231 psi</text>
  <text x="370" y="116" class="t">0.45 T →  81 kPa   →  12 psi</text>
  <text x="370" y="140" class="ts">Ferrite gives up an order of</text>
  <text x="370" y="152" class="ts">magnitude to steel here.</text>
  <text x="370" y="178" class="tb">Past saturation the only way</text>
  <text x="370" y="190" class="tb">to more force is more pole</text>
  <text x="370" y="202" class="tb">area, not more amps.</text>

